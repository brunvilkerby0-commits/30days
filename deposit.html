<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dépôt - 30 Days</title>

<link rel="stylesheet" href="style.css">

<style>
body{
background:#0f172a;
color:#fff;
font-family:Arial,sans-serif;
padding:20px;
}

.card{
background:#1e293b;
padding:20px;
border-radius:15px;
max-width:500px;
margin:auto;
}

h2{
text-align:center;
margin-bottom:20px;
}

select,input,button{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:10px;
font-size:16px;
}

select,input{
background:#334155;
color:white;
}

button{
background:#00c853;
color:white;
font-weight:bold;
cursor:pointer;
}

button:hover{
opacity:.9;
}

#addressBox{
margin-top:20px;
background:#0f172a;
padding:15px;
border-radius:10px;
word-break:break-all;
}

#qr{
width:220px;
display:block;
margin:20px auto;
border-radius:10px;
background:white;
padding:10px;
}

.note{
color:#ffd54f;
margin-top:15px;
text-align:center;
}
</style>
</head>

<body>

<div class="card">

<h2>Dépôt USDT</h2>

<p style="text-align:center">
Minimum dépôt :
<b>10 USDT</b>
</p>

<select id="network" onchange="changeNetwork()">

<option value="bep20">
USDT BEP20
</option>

<option value="trc20">
USDT TRC20
</option>

</select>

<div id="addressBox">

<div id="address">
0x7fD50dAAfeA0a8Df3E4860ECC81939fFBaa11396
</div>

</div>

<button onclick="copyAddress()">
Copier Adresse
</button>

<img
id="qr"
src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=0x7fD50dAAfeA0a8Df3E4860ECC81939fFBaa11396"
>

<div class="note">
Apre ou fin voye USDT yo, tann administratè valide depo a.
</div>

</div>

<script>

const wallets={

bep20:"0x7fD50dAAfeA0a8Df3E4860ECC81939fFBaa11396",

trc20:"TYDHcrwhGkRH68u2fWat72iJoNFqhoadHy"

};

function changeNetwork(){

let net=document.getElementById("network").value;

document.getElementById("address").innerText=wallets[net];

document.getElementById("qr").src=
"https://api.qrserver.com/v1/create-qr-code/?size=220x220&data="+wallets[net];

}

function copyAddress(){

let text=document.getElementById("address").innerText;

navigator.clipboard.writeText(text);

alert("Adresse copiée !");

}

</script>

</body>
</html>
