<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Thirty Days</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="dashboard.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

    <script src="firebase.js"></script>
</head>

<body>

<div class="container">

<header class="header">

<div class="logo-area">

<img src="logo.png" class="logo">

<div>
<h2>Thirty Days</h2>
<p>Investment Platform</p>
</div>

</div>

<div class="profile-icon">
<i class="fas fa-user-circle"></i>
</div>

</header>


<section class="banner">

<img src="banner.png">

</section>


<section class="balance-card">

<p>Total Balance</p>

<h1 id="balance">
0.00 USDT
</h1>

<div class="balance-buttons">

<button onclick="location.href='deposit.html'">
<i class="fas fa-wallet"></i>
Deposit
</button>

<button onclick="location.href='withdraw.html'">
<i class="fas fa-money-bill-wave"></i>
Withdraw
</button>

</div>

</section>


<section class="profit-card">

<h3>
Daily Profit
</h3>

<h2 id="dailyProfit">
0.00 USDT
</h2>

<p>
Claim every 24 Hours
</p>

<button id="claimBtn">
Claim Profit
</button>

</section>


<section class="quick-menu">

<div class="menu-item"
onclick="location.href='history.html'">

<i class="fas fa-clock"></i>

<span>History</span>

</div>

<div class="menu-item"
onclick="location.href='referral.html'">

<i class="fas fa-users"></i>

<span>Referral</span>

</div>

<div class="menu-item"
onclick="location.href='profile.html'">

<i class="fas fa-user"></i>

<span>Profile</span>

</div>

</section>
<section class="transactions">

<h3>Latest Transactions</h3>

<div id="transactionList">

<div class="transaction-item">

<div>
<h4>No transaction</h4>
<p>Waiting...</p>
</div>

<span>0.00 USDT</span>

</div>

</div>

</section>


<section class="support-card">

<a href="https://t.me/ThirtyDaysSupport" target="_blank">

<i class="fab fa-telegram"></i>

Contact Support

</a>

</section>


<nav class="bottom-nav">

<a href="index.html" class="active">
<i class="fas fa-home"></i>
<p>Home</p>
</a>

<a href="deposit.html">
<i class="fas fa-wallet"></i>
<p>Deposit</p>
</a>

<a href="withdraw.html">
<i class="fas fa-money-bill-wave"></i>
<p>Withdraw</p>
</a>

<a href="history.html">
<i class="fas fa-clock"></i>
<p>History</p>
</a>

<a href="profile.html">
<i class="fas fa-user"></i>
<p>Profile</p>
</a>

</nav>

</div>

<script src="auth.js"></script>
<script src="app.js"></script>

</body>
</html>
